plugins {
    id 'com.android.application'
}

def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

android {
    namespace 'io.github.alox_dev.redbound'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'io.github.alox_dev.redbound'
        minSdk 30
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DREDBOUND_TOOLS=OFF', '-DREDBOUND_ASAN=OFF'
                cppFlags '-fexceptions', '-frtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "redbound-${variant.versionName}-android${variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name}.apk"
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!icons'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../../../third_party/SDL2/android-project/app/src/main/java']
            assets.srcDirs = ['src/main/assets', '../../../third_party/gamecontrollerdb', '../../../assets']
            res.srcDirs = ['src/main/res', file('src/main/res-icon-local').exists() ? 'src/main/res-icon-local' : 'src/main/res-icon']
        }
    }
}
